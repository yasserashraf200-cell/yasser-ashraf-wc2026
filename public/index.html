<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D1B2A">
  <title>Yasser Ashraf FIFA WORLD CUP 2026</title>
  <style>
    :root {
      --bg: #0D1B2A;
      --bg2: #1B2838;
      --card: #1E3A5F;
      --card2: #2C5282;
      --gold: #C9A84C;
      --white: #FFFFFF;
      --gray: #B0BEC5;
      --live: #F44336;
      --upcoming: #2196F3;
      --finished: #9E9E9E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--white); min-height: 100vh; }
    
    .header { background: linear-gradient(180deg, #0D1B2A, #1E3A5F); padding: 12px 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo .trophy { font-size: 1.8rem; }
    .logo .title { font-size: 1.1rem; font-weight: bold; color: var(--gold); }
    .logo .sub { font-size: 0.65rem; color: var(--gray); letter-spacing: 2px; }
    .lang-btn { background: var(--card); color: var(--gold); border: 1px solid var(--gold); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .main { margin-top: 65px; margin-bottom: 70px; padding: 15px; max-width: 800px; margin-left: auto; margin-right: auto; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    .tab { background: var(--card); color: var(--gray); border: 1px solid var(--card2); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; }
    .tab.active, .tab:hover { background: var(--gold); color: #1A1A1A; }
    
    .groups-row { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 8px; }
    .gbtn { background: var(--card); color: var(--gray); border: 1px solid var(--card2); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: bold; min-width: 35px; text-align: center; }
    .gbtn.active { background: var(--gold); color: #1A1A1A; }
    
    .match-card { background: var(--card); border: 1px solid var(--card2); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .match-card.live { border-color: var(--live); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(244,67,54,.4)} 50%{box-shadow:0 0 0 8px rgba(244,67,54,0)} }
    
    .mhead { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .mstatus { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .mstatus.live { background: var(--live); color: #fff; }
    .mstatus.upcoming { background: var(--upcoming); color: #fff; }
    .mstatus.finished { background: var(--finished); color: #fff; }
    .mgroup { color: var(--gray); font-size: 0.8rem; }
    
    .mteams { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .tinfo { display: flex; align-items: center; gap: 10px; flex: 1; }
    .tinfo.home { justify-content: flex-end; text-align: right; }
    .tinfo.away { justify-content: flex-start; text-align: left; }
    .tinfo img { width: 40px; height: 30px; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .tnames { display: flex; flex-direction: column; gap: 2px; }
    .tnames .ar { font-size: 0.95rem; font-weight: bold; }
    .tnames .en { font-size: 0.7rem; color: var(--gray); }
    .score { font-size: 1.5rem; font-weight: bold; color: var(--gold); min-width: 80px; text-align: center; }
    .mtime { text-align: center; color: var(--gray); margin-top: 10px; font-size: 0.8rem; }
    
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .gcard { background: var(--card); border: 1px solid var(--card2); border-radius: 12px; overflow: hidden; }
    .gheader { background: linear-gradient(135deg, #C9A84C, #E8D48B); padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
    .gletter { font-size: 1.3rem; font-weight: bold; color: #1A1A1A; }
    .gtitle { font-size: 0.9rem; font-weight: bold; color: #1A1A1A; }
    .gteams { padding: 12px; }
    .grow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg2); border-radius: 8px; margin-bottom: 6px; }
    .grow:last-child { margin-bottom: 0; }
    .grow img { width: 32px; height: 24px; border-radius: 2px; }
    .grow span { font-size: 0.9rem; }
    
    .empty { text-align: center; padding: 50px 20px; color: var(--gray); }
    .empty .icon { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--card2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 2px solid var(--gold); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    .nbtn { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 16px; font-size: 0.8rem; }
    .nbtn.active { color: var(--gold); }
    .nbtn .icon { font-size: 1.2rem; }
    
    @media (max-width: 480px) {
      .mteams { flex-direction: column; gap: 8px; }
      .tinfo.home, .tinfo.away { justify-content: center; text-align: center; }
      .score { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="trophy">🏆</span>
      <div>
        <div class="title">Yasser Ashraf</div>
        <div class="sub">FIFA WORLD CUP 2026</div>
      </div>
    </div>
    <button class="lang-btn" onclick="toggleLang()">EN</button>
  </div>

  <div class="main">
    <div id="matchesPage">
      <div class="tabs">
        <button class="tab active" onclick="filterStatus('all')">كل المباريات</button>
        <button class="tab" onclick="filterStatus('live')">مباشر</button>
        <button class="tab" onclick="filterStatus('upcoming')">قادمة</button>
        <button class="tab" onclick="filterStatus('finished')">منتهية</button>
      </div>
      <div class="groups-row" id="groupsRow"></div>
      <div id="matchesList"><div class="spinner"></div></div>
    </div>
    <div id="groupsPage" style="display:none"><div id="groupsContainer" class="groups-grid"></div></div>
  </div>

  <nav class="bottom-nav">
    <button class="nbtn active" onclick="showPage('matches')"><span class="icon">⚽</span><span>المباريات</span></button>
    <button class="nbtn" onclick="showPage('groups')"><span class="icon">📋</span><span>المجموعات</span></button>
  </nav>

<script>
const API_KEY = '0af473f019dc44408f7b561ec109a646';
const API_URL = 'https://api.football-data.org/v4/competitions/2000/matches';

const teams = {
  769:{ar:'المكسيك',en:'Mexico',f:'mx'},772:{ar:'كوريا الجنوبية',en:'South Korea',f:'kr'},
  774:{ar:'جنوب أفريقيا',en:'South Africa',f:'za'},798:{ar:'التشيك',en:'Czechia',f:'cz'},
  828:{ar:'كندا',en:'Canada',f:'ca'},788:{ar:'سويسرا',en:'Switzerland',f:'ch'},
  8030:{ar:'قطر',en:'Qatar',f:'qa'},1060:{ar:'البوسنة والهرسك',en:'Bosnia-Herzegovina',f:'ba'},
  764:{ar:'البرازيل',en:'Brazil',f:'br'},815:{ar:'المغرب',en:'Morocco',f:'ma'},
  8873:{ar:'اسكتلندا',en:'Scotland',f:'gb'},836:{ar:'هايتي',en:'Haiti',f:'ht'},
  771:{ar:'أمريكا',en:'United States',f:'us'},761:{ar:'باراغواي',en:'Paraguay',f:'py'},
  779:{ar:'أستراليا',en:'Australia',f:'au'},803:{ar:'تركيا',en:'Turkey',f:'tr'},
  759:{ar:'ألمانيا',en:'Germany',f:'de'},791:{ar:'إكوادور',en:'Ecuador',f:'ec'},
  1935:{ar:'ساحل العاج',en:'Ivory Coast',f:'ci'},9460:{ar:'كوراساو',en:'Curaçao',f:'cw'},
  8601:{ar:'هولندا',en:'Netherlands',f:'nl'},766:{ar:'اليابان',en:'Japan',f:'jp'},
  802:{ar:'تونس',en:'Tunisia',f:'tn'},792:{ar:'السويد',en:'Sweden',f:'se'},
  805:{ar:'بلجيكا',en:'Belgium',f:'be'},825:{ar:'مصر',en:'Egypt',f:'eg'},
  840:{ar:'إيران',en:'IR Iran',f:'ir'},783:{ar:'نيوزيلندا',en:'New Zealand',f:'nz'},
  760:{ar:'إسبانيا',en:'Spain',f:'es'},1930:{ar:'الرأس الأخضر',en:'Cape Verde',f:'cv'},
  801:{ar:'السعودية',en:'Saudi Arabia',f:'sa'},758:{ar:'أوروغواي',en:'Uruguay',f:'uy'},
  773:{ar:'فرنسا',en:'France',f:'fr'},804:{ar:'السنغال',en:'Senegal',f:'sn'},
  8062:{ar:'العراق',en:'Iraq',f:'iq'},8872:{ar:'النرويج',en:'Norway',f:'no'},
  762:{ar:'الأرجنتين',en:'Argentina',f:'ar'},816:{ar:'النمسا',en:'Austria',f:'at'},
  778:{ar:'الجزائر',en:'Algeria',f:'dz'},8049:{ar:'الأردن',en:'Jordan',f:'jo'},
  765:{ar:'البرتغال',en:'Portugal',f:'pt'},818:{ar:'كولومبيا',en:'Colombia',f:'co'},
  8070:{ar:'أوزبكستان',en:'Uzbekistan',f:'uz'},1934:{ar:'الكونغو الديمقراطية',en:'Congo DR',f:'cd'},
  770:{ar:'إنجلترا',en:'England',f:'gb'},799:{ar:'كرواتيا',en:'Croatia',f:'hr'},
  763:{ar:'غانا',en:'Ghana',f:'gh'},1836:{ar:'بنما',en:'Panama',f:'pa'}
};

const groupNames = {A:'المجموعة أ',B:'المجموعة ب',C:'المجموعة ج',D:'المجموعة د',E:'المجموعة ه',F:'المجموعة و',G:'المجموعة ز',H:'المجموعة ح',I:'المجموعة ي',J:'المجموعة ك',K:'المجموعة ل',L:'المجموعة م'};
const groupTeams = {
  A:[769,772,774,798],B:[828,788,8030,1060],C:[764,815,8873,836],D:[771,761,779,803],
  E:[759,791,1935,9460],F:[8601,766,802,792],G:[805,825,840,783],H:[760,1930,801,758],
  I:[773,804,8062,8872],J:[762,816,778,8049],K:[765,818,8070,1934],L:[770,799,763,1836]
};

let allMatches = [];
let currentStatus = 'all';
let currentGroup = 'all';
let lang = 'ar';

function flag(code) { return `<img src="https://flagcdn.com/40x30/${code}.png" alt="">`; }
function flagLg(code) { return `<img src="https://flagcdn.com/60x45/${code}.png" alt="">`; }
function tname(id) { const t = teams[id]; return t ? (lang==='ar'?t.ar:t.en) : '???'; }
function tflag(id) { const t = teams[id]; return t ? t.f : ''; }

function showPage(p) {
  document.getElementById('matchesPage').style.display = p==='matches'?'block':'none';
  document.getElementById('groupsPage').style.display = p==='groups'?'block':'none';
  document.querySelectorAll('.nbtn').forEach((b,i) => b.classList.toggle('active', (i===0&&p==='matches')||(i===1&&p==='groups')));
  if (p==='matches') renderMatches();
  if (p==='groups') renderGroups();
}

function filterStatus(s) {
  currentStatus = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderMatches();
}

function filterGroup(g) {
  currentGroup = g;
  document.querySelectorAll('.gbtn').forEach(b => b.classList.toggle('active', b.dataset.g === g));
  renderMatches();
}

function renderGroupTabs() {
  const row = document.getElementById('groupsRow');
  let h = `<button class="gbtn active" data-g="all" onclick="filterGroup('all')">الكل</button>`;
  for (const g of 'ABCDEFGHIJKL'.split('')) {
    h += `<button class="gbtn" data-g="${g}" onclick="filterGroup('${g}')">${g}</button>`;
  }
  row.innerHTML = h;
}

function renderMatches() {
  const el = document.getElementById('matchesList');
  let list = [...allMatches];
  if (currentStatus==='live') list = list.filter(m => m.status==='IN_PLAY'||m.status==='PAUSED');
  else if (currentStatus==='upcoming') list = list.filter(m => m.status==='SCHEDULED'||m.status==='TIMED');
  else if (currentStatus==='finished') list = list.filter(m => m.status==='FINISHED');
  if (currentGroup!=='all') list = list.filter(m => m.group==='GROUP_'+currentGroup);
  
  if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">⚽</div><h3>مفيش مباريات</h3></div>'; return; }
  
  el.innerHTML = list.map(m => {
    const isLive = m.status==='IN_PLAY'||m.status==='PAUSED';
    const isFin = m.status==='FINISHED';
    const isUp = m.status==='SCHEDULED'||m.status==='TIMED';
    const sc = isLive?'live':isFin?'finished':'upcoming';
    const st = isLive?'مباشر':isFin?'منتهية':'قادمة';
    const hFlag = tflag(m.homeTeam.id);
    const aFlag = tflag(m.awayTeam.id);
    const grp = m.group ? m.group.replace('GROUP_','') : '';
    const d = new Date(m.utcDate);
    const time = d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    const date = d.toLocaleDateString('ar-EG',{month:'short',day:'numeric'});
    
    return `<div class="match-card ${isLive?'live':''}">
      <div class="mhead">
        <span class="mstatus ${sc}">${st}</span>
        <span class="mgroup">${grp?'المجموعة '+grp:m.stage||''}</span>
      </div>
      <div class="mteams">
        <div class="tinfo home">
          ${hFlag?flag(hFlag):''}
          <div class="tnames"><span class="ar">${tname(m.homeTeam.id)}</span><span class="en">${m.homeTeam.name}</span></div>
        </div>
        <div class="score">${isUp?'VS':m.score.fullTime.home+' - '+m.score.fullTime.away}</div>
        <div class="tinfo away">
          <div class="tnames"><span class="ar">${tname(m.awayTeam.id)}</span><span class="en">${m.awayTeam.name}</span></div>
          ${aFlag?flag(aFlag):''}
        </div>
      </div>
      <div class="mtime">${isUp?date+' '+time:isFin?date:m.matchday?'Matchday '+m.matchday:date}</div>
    </div>`;
  }).join('');
}

function renderGroups() {
  const el = document.getElementById('groupsContainer');
  let h = '';
  for (const g of 'ABCDEFGHIJKL'.split('')) {
    const ids = groupTeams[g];
    h += `<div class="gcard">
      <div class="gheader"><span class="gletter">${g}</span><span class="gtitle">${groupNames[g]}</span></div>
      <div class="gteams">${ids.map(id => {
        const t = teams[id];
        return `<div class="grow">${t?flag(t.f):''} <span>${t?(lang==='ar'?t.ar:t.en):'???'}</span></div>`;
      }).join('')}</div>
    </div>`;
  }
  el.innerHTML = h;
}

function toggleLang() {
  lang = lang==='ar'?'en':'ar';
  document.querySelector('.lang-btn').textContent = lang==='ar'?'EN':'عربي';
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.documentElement.lang = lang;
  renderMatches();
  renderGroups();
}

async function loadMatches() {
  try {
    const res = await fetch(API_URL, { headers: { 'X-Auth-Token': API_KEY } });
    const data = await res.json();
    allMatches = data.matches || [];
    renderGroupTabs();
    renderMatches();
  } catch(e) {
    document.getElementById('matchesList').innerHTML = '<div class="empty"><div class="icon">⚠️</div><h3>خطأ في تحميل البيانات</h3></div>';
  }
}

loadMatches();
setInterval(loadMatches, 60000);
</script>
</body>
</html>
