}

var notified={};

function askNotify(){
  if(!('Notification' in window)){alert('متصفحك مش بيدعم الإشعارات');return}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){alert('تم تفعيل الإشعارات! هنبعتلك تنبيه عند أي جول')}
    document.getElementById('nBtn').classList.toggle('active',p==='granted');
  });
}

function sendNotif(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  new Notification(title,{body:body,icon:'https://crests.football-data.org/wm26.png',tag:tag||'goal'});
}

function checkNotify(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var now=Date.now();
  for(var i=0;i<matchData.length;i++){
    var m=matchData[i];
    var matchTime=new Date(m[2]).getTime();
    var diff=matchTime-now;
    var key=m[0]+'-'+m[1]+'-'+m[2];
    if(diff>0&&diff<=15*60000&&!notified[key]){
      notified[key]=1;
      var t1=teams[m[0]],t2=teams[m[1]];
      var mins=Math.round(diff/60000);
      var body=t1.a+' vs '+t2.a+(mins<=0?' بدأت دلوقتي!':' بعد '+mins+' دقيقة');
      sendNotif('FIFA WORLD CUP 2026',body,key);
    }
  }
}

function detectGoals(apiMatches){
  for(var i=0;i<apiMatches.length;i++){
    var m=apiMatches[i];
    if(!m.score||!m.score.fullTime)continue;
    var home=m.score.fullTime.home;
    var away=m.score.fullTime.away;
    if(home===null||away===null)continue;
    var id=m.id;
    var prev=prevScores[id];
    var hName=m.homeTeam?m.homeTeam.name:'';
    var aName=m.awayTeam?m.awayTeam.name:'';
    if(prev){
      if(home>prev.h||away>prev.a){
        var scored='';
        if(home>prev.h)scored=hName;
        else if(away>prev.a)scored=aName;
        var min=m.minute?m.minute+"'":'';
        sendNotif('GOAL! '+scored,min+' هدف '+hName+' '+home+' - '+away+' '+aName,'goal-'+id);
      }
    }
    prevScores[id]={h:home,a:away};
  }
}

function fetchLive(){
  fetch('/api/matches').then(function(r){return r.json()}).then(function(matches){
    if(!Array.isArray(matches))return;
    liveMatches=matches;
    detectGoals(matches);
    var hasLive=false;
    for(var i=0;i<matches.length;i++){
      if(matches[i].status==='IN_PLAY'||matches[i].status==='PAUSED'){hasLive=true;break}
    }
    if(hasLive)updateLiveDisplay(matches);
  }).catch(function(){});
}

function updateLiveDisplay(matches){
  for(var i=0;i<matches.length;i++){
    var m=matches[i];

}
