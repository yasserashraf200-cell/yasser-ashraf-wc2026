function sendNotif(title,body,tag){
  if(typeof OneSignal!=='undefined'&&OneSignal.User&&OneSignal.User.pushSubscription){
    OneSignal.postNotification({
      headings:{en:title},
      contents:{en:body},
      tags:[{key:'match',value:tag||'goal'}]
    }).catch(function(){});
  }else if('Notification' in window&&Notification.permission==='granted'){
    new Notification(title,{body:body,icon:'https://crests.football-data.org/wm26.png',tag:tag||'goal'});
  }
}

function checkNotify(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var now=Date.now();
  for(var i=0;i<matchData.length;i++){
    var m=matchData[i];
    var matchTime=new Date(m[2]).getTime();
    var diff=matchTime-now;
    var key=m[0]+'-'+m[1]+'-'+m[2];
    if(diff>0&&diff<=30*60000&&!notified[key]){
      notified[key]=1;
      var t1=teams[m[0]],t2=teams[m[1]];
      var mins=Math.round(diff/60000);
      var body;
      if(mins<=0)body='\u26BD '+t1.a+' vs '+t2.a+' \u0628\u062f\u0627\u064a\u062a!';
      else if(mins<=5)body='\u26BD '+t1.a+' vs '+t2.a+' \u0628\u062a\u0628\u062f\u0623 \u0628\u0639\u062f '+mins+' \u062f\u0642\u064a\u0642\u0629!';
      else body='\u26BD '+t1.a+' vs '+t2.a+' \u0628\u062a\u0628\u062f\u0623 \u0628\u0639\u062f '+mins+' \u062f\u0642\u064a\u0642\u0629';
      sendNotif('\u23F0 \u0627\u0644\u0645\u0628\u0627\u0631\u0627\u0629 \u0642\u0631\u064A\u0628\u0627\u064B',body,key);
    }
  }
}

function detectGoals(apiMatches){
  for(var i=0;i<apiMatches.length;i++){
    var m=apiMatches[i];
    if(!m.score)continue;
    var ft=m.score.fullTime;
    var ht=m.score.halfTime;
    if(!ft)continue;
    var home=ft.home;
    var away=ft.away;
    if(home===null||away===null)continue;
    var id=m.id;
    var prev=prevScores[id];
    var hName=m.homeTeam?m.homeTeam.name:'';
    var aName=m.awayTeam?m.awayTeam.name:'';
    var minute=m.minute?m.minute+"\'":'';
    if(prev!==undefined){
      if(home>prev.h||away>prev.a){
        var scored='';
        if(home>prev.h&&away>prev.a)scored=hName+' \u0648'+aName;
        else if(home>prev.h)scored=hName;
        else if(away>prev.a)scored=aName;
        var body='\u26BD \u0647\u062F\u0641 '+scored+'!\n'+hName+' '+home+' - '+away+' '+aName;
        if(minute)body=minute+' | '+body;
        sendNotif('\u26BD GOAL! '+scored,body,'goal-'+id+'-'+home+'-'+away);
      }
    }
    prevScores[id]={h:home,a:away};
  }
}

function fetchLive(){
  fetch('/api/matches').then(function(r){return r.json()}).then(function(matches){
    if(!Array.isArray(matches)||matches.length===0)return;
    liveMatches=matches;
    detectGoals(matches);
    updateLiveDisplay(matches);
  }).catch(function(){});
}

  "Bosnia and Herzegovina":"BA","Bosnia":"BA","Bosnia-H.":"BA","Bosnia & Herzegovina":"BA",

  "Ecuador":"EC","Côte d'Ivoire":"CI","Australia":"AU"
};

function findMatchCode(apiName){
  if(teamNameMap[apiName])return teamNameMap[apiName];
  var upper=apiName.toUpperCase();
  var codes=Object.keys(teams);
  for(var i=0;i<codes.length;i++){
    var t=teams[codes[i]];
    if(t.e.toUpperCase()===upper)return codes[i];
  }
  for(var i=0;i<codes.length;i++){
    var t=teams[codes[i]];
    if(upper.indexOf(t.e.toUpperCase())>=0||t.e.toUpperCase().indexOf(upper)>=0)return codes[i];
  }
  return null;
}

function updateLiveDisplay(matches){
  for(var i=0;i<matches.length;i++){
    var m=matches[i];
    if(!m.score||!m.score.fullTime)continue;
    var h=m.score.fullTime.home;
    var a=m.score.fullTime.away;
    if(h===null)continue;
    var apiH=m.homeTeam?m.homeTeam.name:'';
    var apiA=m.awayTeam?m.awayTeam.name:'';
    var hCode=findMatchCode(apiH);
    var aCode=findMatchCode(apiA);
    var status=m.status;
    var minute=m.minute||0;
    for(var j=0;j<AM.length;j++){
      var am=AM[j];
      if((hCode&&am.hc===hCode)&&(aCode&&am.ac===aCode)){
        am.sh=h;
        am.sa=a;
        if(status==='IN_PLAY'||status==='PAUSED')am.status='IN_PLAY';
        else if(status==='FINISHED')am.status='FINISHED';
        am.minute=minute;
        break;
      }
    }
  }
  rm();
}
